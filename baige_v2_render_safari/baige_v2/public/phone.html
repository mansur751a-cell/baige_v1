<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>БӘЙГЕ — Телефон</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:system-ui}main{max-width:560px;margin:auto;padding:24px 18px}.logo{font-size:55px;font-weight:1000}.card{background:#1b1b1b;border:1px solid #333;border-radius:22px;padding:20px;margin-top:18px}input{width:100%;height:55px;border-radius:14px;border:1px solid #444;background:#0d0d0d;color:white;padding:0 15px;font-size:18px}.btn{width:100%;min-height:55px;border:0;border-radius:14px;background:white;color:#111;font-weight:900;font-size:17px;margin-top:12px}.hidden{display:none}.status{margin-top:14px;font-weight:800;min-height:24px}.error{color:#ffaaa8}.shake{height:220px;margin-top:18px;border-radius:28px;background:#262626;display:flex;align-items:center;justify-content:center;text-align:center}.emoji{font-size:80px}.meter{height:12px;background:#333;border-radius:20px;margin-top:15px;overflow:hidden}.bar{height:100%;width:0;background:white;transition:width .08s}</style></head><body><main><div class="logo">БӘЙГЕ</div><div style="color:#aaa">Управление лошадью</div><section class="card" id="join"><label>Имя игрока</label><input id="name" maxlength="24" placeholder="Например: Мансур"><button class="btn" id="joinBtn">Войти в гонку</button><div class="status" id="joinStatus"></div></section><section id="controller" class="hidden"><div class="card"><b id="player"></b><p style="color:#aaa">Сначала разрешите датчик. Во время гонки встряхивайте телефон. Сильнее тряска — быстрее конь.</p><button class="btn" id="motion">📱 Разрешить движение</button><div class="shake"><div><div class="emoji">🏇</div><b id="shakeText">ОЖИДАНИЕ</b></div></div><div class="meter"><div class="bar" id="bar"></div></div><div class="status" id="status"></div></div></section><script>const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);let id=null,running=false,ready=false,last=0,lastSend=0;const $=x=>document.querySelector(x),send=x=>ws.readyState===1&&ws.send(JSON.stringify(x));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){id=m.id;$('#join').classList.add('hidden');$('#controller').classList.remove('hidden');$('#player').textContent='Игрок: '+m.name;$('#status').textContent='Подключено. Ждём старта.'}if(m.type==='error'){$('#joinStatus').textContent=m.message;$('#joinStatus').className='status error'}if(m.type==='race'){running=m.race.state==='running';$('#shakeText').textContent=running?'ТРЯСИТЕ ТЕЛЕФОН':'ОЖИДАНИЕ';$('#status').textContent=running?'🏁 ГОНКА НАЧАЛАСЬ':'Ожидание'}if(m.type==='tick'){let p=(m.players||[]).find(x=>x.id===id);if(p)$('#bar').style.width=p.progress+'%'}if(m.type==='finish'){running=false;let win=m.winner.id===id;$('#status').textContent=win?'🏆 ВЫ ПОБЕДИЛИ!':'Финиш! Победитель: '+m.winner.name;$('#shakeText').textContent=win?'🏆':'ФИНИШ'}if(m.type==='resetPhone')location.reload()};joinBtn.onclick=()=>{let n=$('#name').value.trim();if(n)send({type:'join',name:n});else $('#joinStatus').textContent='Введите имя'};async function requestMotion(){try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){let p=await DeviceMotionEvent.requestPermission();if(p!=='granted'){setStatus('Safari не дал доступ к датчику. Нажмите разрешение ещё раз.',true);return}}window.addEventListener('devicemotion',motion,{passive:true});ready=true;$('#motion').textContent='✅ Датчик разрешён';$('#motion').disabled=true;setStatus('Датчик готов. Ждём старта.')}catch(e){setStatus('Не удалось включить датчик. Проверьте разрешения Safari.',true)}}function setStatus(t,err){$('#status').textContent=t;$('#status').className='status'+(err?' error':'')}motion.onclick=requestMotion;function motion(e){if(!running)return;let a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;let x=+a.x||0,y=+a.y||0,z=+a.z||0,mag=Math.sqrt(x*x+y*y+z*z),delta=Math.abs(mag-last);last=mag;let now=performance.now();if(delta>1.4&&now-lastSend>70){let intensity=Math.max(0,Math.min(1,(delta-1.4)/7));send({type:'shake',intensity});lastSend=now}};</script></main></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БӘЙГЕ — LED</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8d9;color:#171717;font-family:system-ui;overflow:hidden}header{height:13vh;padding:2vh 3vw;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c7bead}.logo{font-size:clamp(38px,6vw,90px);font-weight:1000}.state{font-size:clamp(16px,2vw,30px);font-weight:800}.qr{position:absolute;right:2vw;top:16vh;width:min(15vw,210px);background:white;padding:10px;border-radius:14px;text-align:center}.qr img{width:100%}.url{font-size:11px;word-break:break-all}.track{height:87vh;padding:1vh 2vw;overflow:auto}.lane{height:70px;position:relative;border-bottom:2px dashed #bdb4a4}.name{position:absolute;left:0;top:8px;width:17%;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.horse{position:absolute;left:18%;top:5px;font-size:45px;transition:left .08s}.finish{position:absolute;right:1%;top:0;bottom:0;width:18px;background:repeating-linear-gradient(45deg,#111 0 8px,#fff 8px 16px)}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;text-align:center}.overlay.show{display:flex}.win{background:white;color:#111;padding:50px 80px;border-radius:30px}.win h1{font-size:clamp(45px,8vw,120px);margin:10px}.btn{padding:14px 25px;border:0;border-radius:12px;font-weight:800}</style></head><body><header><div class="logo">БӘЙГЕ</div><div class="state" id="state">ОЖИДАНИЕ</div></header><div class="qr"><img id="qr"><b>СКАНИРУЙТЕ QR</b><div class="url" id="url"></div></div><div class="track" id="track"><div class="finish"></div></div><div class="overlay" id="overlay"><div class="win"><div>🏆</div><h1 id="wn">Победитель</h1><p>Первый на финише!</p><button class="btn" id="reset">Новый заезд</button></div></div><script>const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host),track=document.querySelector('#track'),state=document.querySelector('#state');let players=[];const horses=['🏇🏻','🏇🏼','🏇🏽','🏇🏾','🏇🏿','🐎'];function send(x){if(ws.readyState===1)ws.send(JSON.stringify(x))}function render(a=[]){players=a;track.querySelectorAll('.lane').forEach(x=>x.remove());a.forEach((p,i)=>{let l=document.createElement('div');l.className='lane';let n=document.createElement('div');n.className='name';n.textContent=(i+1)+'. '+p.name;let h=document.createElement('div');h.className='horse';h.textContent=horses[i%horses.length];h.style.left=(18+p.progress*.80)+'%';l.append(n,h);track.append(l)});if(state.textContent==='ОЖИДАНИЕ'||state.textContent.startsWith('ИГРОКОВ'))state.textContent='ИГРОКОВ: '+a.length}fetch('/qr').then(r=>r.text()).then(x=>qr.src=x);url.textContent=location.origin+'/phone';ws.onopen=()=>send({type:'screen'});ws.onmessage=e=>{let m=JSON.parse(e.data);if(['state','players','tick'].includes(m.type))render(m.players);if(m.type==='race'){render(m.players);state.textContent='🏁 ГОНКА';}if(m.type==='finish'){render(m.players);state.textContent='🏆 ФИНИШ';wn.textContent=m.winner.name;overlay.classList.add('show')}};document.addEventListener('keydown',e=>{if(e.code==='Space')send({type:'start'})});reset.onclick=()=>{overlay.classList.remove('show');send({type:'reset'})}</script></body></html>
